<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin — Trip Organizer</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">Family Reunion - LA 2026</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="itinerary.html" class="nav-link">Itinerary</a>
  <a href="attractions.html" class="nav-link">Attractions</a>
  <a href="restaurants.html" class="nav-link">Restaurants</a>
  <a href="flights.html" class="nav-link">Flights</a>
  <div class="nav-spacer"></div>
  <a href="admin.html" class="nav-link nav-admin active">⚙ Admin</a>
</nav>

<main>
  <div class="admin-header">
    <div style="font-size:28px">⚙️</div>
    <h1>Admin Panel</h1>
    <span style="font-size:13px;opacity:.6">Edit trip content visible to all family members</span>
  </div>

  <div class="password-bar">
    <label for="admin-password">Admin Password</label>
    <input type="password" id="admin-password" placeholder="Enter password to save changes" style="max-width:260px">
    <button class="btn btn-primary btn-sm" onclick="saveAll()">💾 Save All Changes</button>
    <span id="save-status" class="save-status" style="display:none"></span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('trip', this)">🌍 Trip Info</button>
    <button class="tab-btn" onclick="switchTab('itinerary', this)">🗓️ Itinerary</button>
    <button class="tab-btn" onclick="switchTab('attractions', this)">📍 Attractions</button>
    <button class="tab-btn" onclick="switchTab('restaurants', this)">🍽️ Restaurants</button>
    <button class="tab-btn" onclick="switchTab('flights', this)">✈️ Flights</button>
  </div>

  <!-- ── Trip Info ── -->
  <div id="tab-trip" class="tab-panel active">
    <div class="card">
      <div class="form-group">
        <label>Trip Name</label>
        <input type="text" id="trip-name" placeholder="e.g. Family Paris Trip">
      </div>
      <div class="form-group">
        <label>Destination</label>
        <input type="text" id="trip-destination" placeholder="e.g. Paris, France">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="trip-start">
        </div>
        <div class="form-group">
          <label>End Date</label>
          <input type="date" id="trip-end">
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="trip-description" placeholder="A short description shown on the home page…" rows="3"></textarea>
      </div>
    </div>
  </div>

  <!-- ── Itinerary ── -->
  <div id="tab-itinerary" class="tab-panel">
    <div id="itinerary-items"></div>
    <div class="add-item-row">
      <button class="btn btn-ghost" onclick="addDay()">+ Add Day</button>
    </div>
  </div>

  <!-- ── Attractions ── -->
  <div id="tab-attractions" class="tab-panel">
    <div id="attraction-items"></div>
    <div class="add-item-row">
      <button class="btn btn-ghost" onclick="addAttraction()">+ Add Attraction</button>
    </div>
  </div>

  <!-- ── Restaurants ── -->
  <div id="tab-restaurants" class="tab-panel">
    <div id="restaurant-items"></div>
    <div class="add-item-row">
      <button class="btn btn-ghost" onclick="addRestaurant()">+ Add Restaurant</button>
    </div>
  </div>

  <!-- ── Flights ── -->
  <div id="tab-flights" class="tab-panel">
    <div id="flight-items"></div>
    <div class="add-item-row">
      <button class="btn btn-ghost" onclick="addFlight()">+ Add Flight</button>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
let state = { trip: {}, itinerary: [], attractions: [], restaurants: [], flights: [] };

// ── Tab switching ─────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── Load data ─────────────────────────────────────
async function loadData() {
  try {
    state = await loadTripData();
    state.restaurants = state.restaurants || [];
    state.flights = state.flights || [];
    renderTripInfo();
    renderItinerary();
    renderAttractions();
    renderRestaurants();
    renderFlights();
  } catch {
    showStatus('Could not load data from server.', false);
  }
}

// ── Collect state from DOM ────────────────────────
function collectState() {
  state.trip = {
    name:        document.getElementById('trip-name').value.trim(),
    destination: document.getElementById('trip-destination').value.trim(),
    startDate:   document.getElementById('trip-start').value,
    endDate:     document.getElementById('trip-end').value,
    description: document.getElementById('trip-description').value.trim()
  };
  state.itinerary   = collectItinerary();
  state.attractions = collectAttractions();
  state.restaurants = collectRestaurants();
  state.flights     = collectFlights();
}

// ── Save all ──────────────────────────────────────
async function saveAll() {
  const password = document.getElementById('admin-password').value;
  if (!password) { showStatus('Enter the admin password first.', false); return; }
  collectState();
  try {
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, ...state })
    });
    const json = await res.json();
    if (!res.ok) { showStatus(json.error || 'Save failed.', false); return; }
    showStatus('Saved successfully!', true);
  } catch {
    showStatus('Network error — could not save.', false);
  }
}

function showStatus(msg, ok) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.className = 'save-status ' + (ok ? 'success' : 'error');
  el.style.display = '';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ── Trip Info ─────────────────────────────────────
function renderTripInfo() {
  const t = state.trip || {};
  document.getElementById('trip-name').value        = t.name || '';
  document.getElementById('trip-destination').value = t.destination || '';
  document.getElementById('trip-start').value       = t.startDate || '';
  document.getElementById('trip-end').value         = t.endDate || '';
  document.getElementById('trip-description').value = t.description || '';
}

// ── Itinerary ─────────────────────────────────────
function renderItinerary() {
  const container = document.getElementById('itinerary-items');
  container.innerHTML = '';
  (state.itinerary || []).forEach((day, i) => container.appendChild(buildDayEl(day, i)));
}

function buildDayEl(day, i) {
  const div = document.createElement('div');
  div.className = 'admin-item';
  div.innerHTML = `
    <div class="admin-item-header">
      <span>Day ${i + 1}</span>
      <button class="btn btn-danger btn-sm" onclick="removeDay(${i})">Remove</button>
    </div>
    <div class="form-row-3">
      <div class="form-group">
        <label>Day #</label>
        <input type="text" class="day-num" value="${esc(String(day.day || (i+1)))}">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" class="day-date" value="${esc(day.date || '')}">
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" class="day-title" value="${esc(day.title || '')}" placeholder="e.g. Arrival Day">
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea class="day-notes" rows="3">${esc(day.notes || '')}</textarea>
    </div>
    <div class="form-group">
      <label>Attractions visited (comma-separated)</label>
      <input type="text" class="day-attractions" value="${esc((day.attractions || []).join(', '))}" placeholder="Eiffel Tower, The Louvre">
    </div>
  `;
  return div;
}

function addDay() {
  state.itinerary = collectItinerary();
  state.itinerary.push({ day: state.itinerary.length + 1, date: '', title: '', notes: '', attractions: [] });
  renderItinerary();
}

function removeDay(i) {
  state.itinerary = collectItinerary();
  state.itinerary.splice(i, 1);
  renderItinerary();
}

function collectItinerary() {
  return [...document.querySelectorAll('#itinerary-items .admin-item')].map(el => ({
    day:         parseInt(el.querySelector('.day-num').value) || 0,
    date:        el.querySelector('.day-date').value,
    title:       el.querySelector('.day-title').value.trim(),
    notes:       el.querySelector('.day-notes').value.trim(),
    attractions: el.querySelector('.day-attractions').value.split(',').map(s => s.trim()).filter(Boolean)
  }));
}

// ── Attractions ───────────────────────────────────
function renderAttractions() {
  const container = document.getElementById('attraction-items');
  container.innerHTML = '';
  (state.attractions || []).forEach((a, i) => container.appendChild(buildAttractionEl(a, i)));
}

function buildAttractionEl(a, i) {
  const div = document.createElement('div');
  div.className = 'admin-item';
  div.innerHTML = `
    <div class="admin-item-header">
      <span>${esc(a.name) || 'New Attraction'}</span>
      <button class="btn btn-danger btn-sm" onclick="removeAttraction(${i})">Remove</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" class="a-name" value="${esc(a.name || '')}" placeholder="Attraction name">
      </div>
      <div class="form-group">
        <label>Website URL</label>
        <input type="url" class="a-url" value="${esc(a.url || '')}" placeholder="https://…">
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="a-desc" rows="2">${esc(a.description || '')}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Address</label>
        <input type="text" class="a-addr" value="${esc(a.address || '')}" placeholder="Street, City, Country">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" class="a-phone" value="${esc(a.phone || '')}" placeholder="+1 555 000 0000">
      </div>
    </div>
  `;
  return div;
}

function addAttraction() {
  state.attractions = collectAttractions();
  state.attractions.push({ name: '', description: '', url: '', address: '', phone: '' });
  renderAttractions();
}

function removeAttraction(i) {
  state.attractions = collectAttractions();
  state.attractions.splice(i, 1);
  renderAttractions();
}

function collectAttractions() {
  return [...document.querySelectorAll('#attraction-items .admin-item')].map(el => ({
    name:        el.querySelector('.a-name').value.trim(),
    description: el.querySelector('.a-desc').value.trim(),
    url:         el.querySelector('.a-url').value.trim(),
    address:     el.querySelector('.a-addr').value.trim(),
    phone:       el.querySelector('.a-phone').value.trim()
  }));
}

// ── Restaurants ───────────────────────────────────
function renderRestaurants() {
  const container = document.getElementById('restaurant-items');
  container.innerHTML = '';
  (state.restaurants || []).forEach((r, i) => container.appendChild(buildRestaurantEl(r, i)));
}

function buildRestaurantEl(r, i) {
  const div = document.createElement('div');
  div.className = 'admin-item';
  div.innerHTML = `
    <div class="admin-item-header">
      <span>${esc(r.name) || 'New Restaurant'}</span>
      <button class="btn btn-danger btn-sm" onclick="removeRestaurant(${i})">Remove</button>
    </div>
    <div class="form-group">
      <label>Restaurant Name</label>
      <input type="text" class="r-name" value="${esc(r.name || '')}" placeholder="e.g. Nobu Malibu">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="r-desc" rows="2">${esc(r.description || '')}</textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Address</label>
        <input type="text" class="r-addr" value="${esc(r.address || '')}" placeholder="Street, City, State">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" class="r-phone" value="${esc(r.phone || '')}" placeholder="+1 555 000 0000">
      </div>
    </div>
  `;
  return div;
}

function addRestaurant() {
  state.restaurants = collectRestaurants();
  state.restaurants.push({ name: '', description: '', address: '', phone: '' });
  renderRestaurants();
}

function removeRestaurant(i) {
  state.restaurants = collectRestaurants();
  state.restaurants.splice(i, 1);
  renderRestaurants();
}

function collectRestaurants() {
  return [...document.querySelectorAll('#restaurant-items .admin-item')].map(el => ({
    name:        el.querySelector('.r-name').value.trim(),
    description: el.querySelector('.r-desc').value.trim(),
    address:     el.querySelector('.r-addr').value.trim(),
    phone:       el.querySelector('.r-phone').value.trim()
  }));
}

// ── Flights ───────────────────────────────────────
function renderFlights() {
  const container = document.getElementById('flight-items');
  container.innerHTML = '';
  (state.flights || []).forEach((f, i) => container.appendChild(buildFlightEl(f, i)));
}

function buildFlightEl(f, i) {
  const div = document.createElement('div');
  div.className = 'admin-item';
  div.innerHTML = `
    <div class="admin-item-header">
      <span>${esc(f.traveler) || 'New Flight'} — ${esc(f.from) || '???'} → ${esc(f.to) || '???'}</span>
      <button class="btn btn-danger btn-sm" onclick="removeFlight(${i})">Remove</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Traveler Name</label>
        <input type="text" class="f-traveler" value="${esc(f.traveler || '')}" placeholder="e.g. Ivan">
      </div>
      <div class="form-group">
        <label>Flight Number</label>
        <input type="text" class="f-num" value="${esc(f.flightNumber || '')}" placeholder="e.g. AA 2841">
      </div>
    </div>
    <div class="form-row-4">
      <div class="form-group">
        <label>From (airport code)</label>
        <input type="text" class="f-from" value="${esc(f.from || '')}" placeholder="JFK" maxlength="4" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label>Departure Time</label>
        <input type="text" class="f-dep" value="${esc(f.departureTime || '')}" placeholder="11:00 PM">
      </div>
      <div class="form-group">
        <label>To (airport code)</label>
        <input type="text" class="f-to" value="${esc(f.to || '')}" placeholder="CDG" maxlength="4" style="text-transform:uppercase">
      </div>
      <div class="form-group">
        <label>Arrival Time</label>
        <input type="text" class="f-arr" value="${esc(f.arrivalTime || '')}" placeholder="1:15 PM">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Date</label>
        <input type="date" class="f-date" value="${esc(f.date || '')}">
      </div>
      <div class="form-group">
        <label>Confirmation Number</label>
        <input type="text" class="f-conf" value="${esc(f.confirmation || '')}" placeholder="Optional">
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" class="f-notes" value="${esc(f.notes || '')}" placeholder="e.g. Non-stop, 7h 15m">
    </div>
  `;
  return div;
}

function addFlight() {
  state.flights = collectFlights();
  state.flights.push({ traveler: '', flightNumber: '', date: '', from: '', departureTime: '', to: '', arrivalTime: '', confirmation: '', notes: '' });
  renderFlights();
}

function removeFlight(i) {
  state.flights = collectFlights();
  state.flights.splice(i, 1);
  renderFlights();
}

function collectFlights() {
  return [...document.querySelectorAll('#flight-items .admin-item')].map(el => ({
    traveler:      el.querySelector('.f-traveler').value.trim(),
    flightNumber:  el.querySelector('.f-num').value.trim(),
    date:          el.querySelector('.f-date').value,
    from:          el.querySelector('.f-from').value.trim().toUpperCase(),
    departureTime: el.querySelector('.f-dep').value.trim(),
    to:            el.querySelector('.f-to').value.trim().toUpperCase(),
    arrivalTime:   el.querySelector('.f-arr').value.trim(),
    confirmation:  el.querySelector('.f-conf').value.trim(),
    notes:         el.querySelector('.f-notes').value.trim()
  }));
}

// ── Init ──────────────────────────────────────────
loadData();
</script>
</body>
</html>
