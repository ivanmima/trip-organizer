<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Attractions — Trip Organizer</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">✈️ Trip Organizer</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="itinerary.html" class="nav-link">Itinerary</a>
  <a href="attractions.html" class="nav-link">Attractions</a>
  <a href="flights.html" class="nav-link">Flights</a>
  <div class="nav-spacer"></div>
  <a href="admin.html" class="nav-link nav-admin">⚙ Admin</a>
</nav>

<main>
  <div class="page-header">
    <h1>📍 Attractions</h1>
    <p>All the places you'll visit — with websites, addresses, and phone numbers.</p>
  </div>
  <div id="attractions-grid" class="attractions-grid">
    <div class="loading" style="grid-column:1/-1">Loading attractions…</div>
  </div>
</main>

<script src="app.js"></script>
<script>
  (async () => {
    const grid = document.getElementById('attractions-grid');
    try {
      const data = await loadTripData();
      const list = data.attractions || [];
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📍</div><p>No attractions added yet. The admin can add them in the Admin panel.</p></div>';
        return;
      }
      grid.innerHTML = list.map(a => `
        <div class="attraction-card">
          <h3>${esc(a.name)}</h3>
          ${a.description ? `<p class="description">${esc(a.description)}</p>` : ''}
          <div class="attraction-meta">
            ${a.url ? `
              <div class="meta-row">
                <span class="icon">🌐</span>
                <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url.replace(/^https?:\/\//, ''))}</a>
              </div>
            ` : ''}
            ${a.address ? `
              <div class="meta-row">
                <span class="icon">📌</span>
                <span>${esc(a.address)}</span>
              </div>
            ` : ''}
            ${a.phone ? `
              <div class="meta-row">
                <span class="icon">📞</span>
                <a href="tel:${esc(a.phone)}">${esc(a.phone)}</a>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    } catch {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><p>Could not load attractions. Make sure the server is running.</p></div>';
    }
  })();
</script>
</body>
</html>
