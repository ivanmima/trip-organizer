<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#1D4ED8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip">
  <link rel="apple-touch-icon" href="/Reunion_App_Icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">Family Reunion - LA 2026</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="itinerary.html" class="nav-link">Itinerary</a>

  <a href="flights.html" class="nav-link">Flights</a>
  <div class="nav-spacer"></div>
  <a href="admin.html" class="nav-link nav-admin">⚙ Admin</a>
</nav>

<main>
  <div class="page-header">
    <h1>🏨 Hotels</h1>
    <p>Where we're staying during the reunion.</p>
  </div>
  <div id="hotels-grid" class="attractions-grid">
    <div class="loading" style="grid-column:1/-1">Loading hotels…</div>
  </div>
</main>

<script src="app.js"></script>
<script>
  (async () => {
    const grid = document.getElementById('hotels-grid');
    try {
      const data = await loadTripData();
      const list = data.hotels || [];
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🏨</div><p>No hotels added yet. The admin can add them in the Admin panel.</p></div>';
        return;
      }
      grid.innerHTML = list.map(h => `
        <div class="attraction-card">
          <h3>${esc(h.name)}</h3>
          ${h.description ? `<p class="description">${esc(h.description)}</p>` : ''}
          <div class="attraction-meta">
            ${h.address ? `
              <div class="meta-row">
                <span class="icon">📌</span>
                <span>${esc(h.address)}</span>
              </div>
            ` : ''}
            ${h.phone ? `
              <div class="meta-row">
                <span class="icon">📞</span>
                <a href="tel:${esc(h.phone)}">${esc(h.phone)}</a>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    } catch {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><p>Could not load hotels. Make sure the server is running.</p></div>';
    }
  })();
</script>

</nav>
