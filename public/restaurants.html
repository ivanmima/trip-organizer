<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Restaurants — Family Reunion</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trip">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html" class="nav-brand">Family Reunion - LA 2026</a>
  <a href="index.html" class="nav-link">Home</a>
  <a href="itinerary.html" class="nav-link">Itinerary</a>
  <a href="attractions.html" class="nav-link">Attractions</a>
  <a href="restaurants.html" class="nav-link">Restaurants</a>
  <a href="hotels.html" class="nav-link">Hotels</a>
  <a href="flights.html" class="nav-link">Flights</a>
  <div class="nav-spacer"></div>
  <a href="admin.html" class="nav-link nav-admin">⚙ Admin</a>
</nav>

<main>
  <div class="page-header">
    <h1>🍽️ Restaurants</h1>
    <p>Places to eat during the reunion — with addresses and phone numbers.</p>
  </div>
  <div id="restaurants-grid" class="attractions-grid">
    <div class="loading" style="grid-column:1/-1">Loading restaurants…</div>
  </div>
</main>

<script src="app.js"></script>
<script>
  (async () => {
    const grid = document.getElementById('restaurants-grid');
    try {
      const data = await loadTripData();
      const list = data.restaurants || [];
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🍽️</div><p>No restaurants added yet. The admin can add them in the Admin panel.</p></div>';
        return;
      }
      grid.innerHTML = list.map(r => `
        <div class="attraction-card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <h3>${esc(r.name)}</h3>
            ${r.category ? `<span class="attraction-tag">${esc(r.category)}</span>` : ''}
          </div>
          ${r.description ? `<p class="description">${esc(r.description)}</p>` : ''}
          <div class="attraction-meta">
            ${r.address ? `
              <div class="meta-row">
                <span class="icon">📌</span>
                <span>${esc(r.address)}</span>
              </div>
            ` : ''}
            ${r.phone ? `
              <div class="meta-row">
                <span class="icon">📞</span>
                <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('');
    } catch {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">⚠️</div><p>Could not load restaurants. Make sure the server is running.</p></div>';
    }
  })();
</script>
</body>
</html>
